<body>
  <script>
    (function () {
      var portfolioRoutes = ['/', '/contact', '/mvp', '/demos'];
      var path = window.location.pathname;
      if (portfolioRoutes.indexOf(path) === -1) return;

      var pref = localStorage.getItem('portfolio-theme-preference') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.classList.add('portfolio-theme', 'portfolio-dark-pending');
      if (dark) root.classList.add('dark');
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
